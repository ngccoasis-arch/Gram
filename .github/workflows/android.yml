name: Build Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Test, lint, and assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Require live Telegram credentials
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [[ ! "$TELEGRAM_API_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "TELEGRAM_API_ID is missing or invalid; refusing to publish a non-login APK." >&2
            exit 1
          fi
          if [[ -z "${TELEGRAM_API_HASH//[[:space:]]/}" || "$TELEGRAM_API_HASH" == "not-configured" ]]; then
            echo "TELEGRAM_API_HASH is missing; refusing to publish a non-login APK." >&2
            exit 1
          fi

      - name: Download pinned TDLib prebuilt output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/download-tdlib-artifact.sh
          scripts/download-tdlib-artifact.sh

      - name: Inspect pinned TDLib Maven repository
        shell: bash
        run: find prebuilts/tdlib-maven -type f -printf '%P\n' | sort

      - name: Test, lint, and build TDLib-backed APK
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --refresh-dependencies -PgramTdlibMode=production testDebugUnitTest lintDebug assembleDebug

      - name: Verify Android 16 KB APK alignment
        shell: bash
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: gram-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
